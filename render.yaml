services:
  - type: web
    name: viasegura-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Render genera un secreto aleatorio largo la primera vez.
      - key: JWT_SECRET
        generateValue: true
      - key: RISK_SERVICE_URL
        sync: false
      # URLs de los frontends separadas por coma (dashboard, empresa, supervisor).
      - key: CORS_ORIGINS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
